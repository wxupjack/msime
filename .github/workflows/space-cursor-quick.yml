name: 空格振动完整 quick

# 仅存在于个人 fork 的测试分支，实际检查固定的产品提交。
on:
  push:
    branches: [codex/android-space-cursor-quick]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-cursor-quick-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quick:
    if: github.repository == 'wxupjack/msime'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      MSIME_EDITION: pinyin
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: 签出当前产品提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e0e13ae955dd75c116b472ae2c0a871272ed28eb
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: 准备 Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 释放临时 runner 空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: 准备 quick 所需工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep libxml2-utils cmake ninja-build pkg-config libssl-dev libasound2-dev libdbus-1-dev libclang-dev
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' platform-tools
          bash platforms/android/install-ndk.sh
          bash scripts/rustup-install.sh aarch64-linux-android
          bash platforms/windows/bootstrap-vcpkg.sh
          npm install --global pnpm@11.5.2
          pnpm install --frozen-lockfile --ignore-scripts
      - name: 核对产品源码和上游基线
        run: |
          git fetch https://github.com/metasequoiaime/msime.git develop:refs/remotes/upstream/develop
          git update-ref refs/remotes/origin/develop refs/remotes/upstream/develop
          test "$(git rev-parse HEAD)" = e0e13ae955dd75c116b472ae2c0a871272ed28eb
          git diff --exit-code
          git diff --cached --exit-code
          mkdir -p target/android
          {
            echo "product_commit=$(git rev-parse HEAD)"
            echo "base_commit=$(git merge-base origin/develop HEAD)"
            echo "run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee target/android/quick-source.txt
      - name: 执行完整 quick
        run: |
          set +e
          bash scripts/verify-local.sh --quick 2>&1 | tee target/android/quick.log
          result=${PIPESTATUS[0]}
          echo "quick_exit_code=$result" >> "$GITHUB_STEP_SUMMARY"
          cat target/android/quick-source.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: space-cursor-quick-${{ github.run_number }}
          path: |
            target/android/quick.log
            target/android/quick-source.txt
          if-no-files-found: warn
          retention-days: 14
