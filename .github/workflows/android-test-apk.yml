name: Android 测试 APK

# 只在个人 fork 的测试分支构建；修复 PR 使用不含此工作流的原修复分支。
on:
  push:
    branches: [codex/android-trackpad-haptic-apk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    if: github.repository == 'wxupjack/msime'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      MSIME_EDITION: pinyin
      MSIME_ANDROID_ABIS: arm64-v8a
      MSIME_ANDROID_OMIT_ON_DEMAND: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: 签出本次提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: 准备笔记校验运行时
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 为构建释放临时 runner 空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: 安装 Android 构建工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep libxml2-utils cmake ninja-build pkg-config libssl-dev
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' platform-tools
          ./platforms/android/install-ndk.sh
          ./scripts/rustup-install.sh aarch64-linux-android
          ./platforms/windows/bootstrap-vcpkg.sh
      - name: 检查差异和决策笔记
        run: |
          git diff --check HEAD~2 HEAD
          node .agents/skills/write-notes-like-deepseek/scripts/verify-agent-note-tree.ts
          node .agents/skills/write-notes-like-deepseek/scripts/verify-agent-note-format.ts
          node .agents/skills/write-notes-like-deepseek/scripts/verify-archived-agent-notes.ts
      - name: 检查 Android 宿主并运行 JVM 冒烟
        run: ./platforms/android/check-host.sh
      - name: 构建开发签名的水杉拼音 APK
        run: |
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources --locked -- target/resources)"
          ./platforms/android/build-apk.sh "$resource_dir"
      - name: 检查最低 Android API 兼容性
        run: platforms/android/gradle-app/gradlew --project-dir platforms/android/gradle-app --console=plain lintPinyinRelease
      - name: 记录测试包来源
        run: |
          mkdir -p target/android/test-artifact
          cp target/android/msime-android-pinyin.apk target/android/test-artifact/
          {
            echo '水杉拼音：触控板振动强度修复测试包'
            echo "commit=$GITHUB_SHA"
            echo "run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'ABI=arm64-v8a'
            echo '开发签名：不能覆盖同包名的正式版；可与完整版并行安装。'
            echo '仅构建及静态/JVM 检查；实际振动强度、开关和边界行为需在手机验收。'
            sha256sum target/android/msime-android-pinyin.apk
          } > target/android/test-artifact/build-info.txt
          cat target/android/test-artifact/build-info.txt >> "$GITHUB_STEP_SUMMARY"
      - name: 上传测试 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-pinyin-trackpad-${{ github.run_number }}
          path: target/android/test-artifact/
          if-no-files-found: error
          retention-days: 14
